<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Todo</title>

	
    <style>
		
        input[type="submit"] {
			/* マウスを乗せたときの動きをなめらかにする */
            transition: transform 0.2s ease;
			
			/* マウスを乗せたとき、カーソルを指の形にする */
            cursor: pointer;
        }

        /* マウスを乗せたときに小さくする */
        input[type="submit"]:hover {
            transform: scale(0.95);
        }
		
    </style>
	
	
</head>

<body style="text-align: center; margin-top: 40vh;">

    <h1 style="margin-bottom: -2vh;">TODOアプリ TOP</h1>

    <div style="display: inline-flex; gap: 20px; margin-top: 30px;">

        <form th:action="@{/register}" method="get">
            <input type="submit" value="ユーザ登録"
                   style="background-color: rgb(92, 180, 59); color: white; border: none; padding: 8px 16px; border-radius: 10px;">
        </form>

        <form th:action="@{/login}" method="get">
            <input type="submit" value="ログイン"
                   style="background-color: rgb(74, 108, 226); color: white; border: none; padding: 8px 16px; border-radius: 10px;">
        </form>

    </div>

</body>
</html>
