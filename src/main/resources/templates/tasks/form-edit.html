<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>タスク編集</title>
	
	
    <style>
		
        body {
            font-family: sans-serif;
            margin: 40px;
            background-color: #fafafa;
        }
		
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        h2 {
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
            font-size: 14px;
        }

        input[type="text"],
        input[type="date"],
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        .button-group {
            margin-top: 30px;
            display: flex;
            gap: 10px;
        }

        .btn-update {
            background-color: #0d6efd;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
        }

        .btn-update:hover {
            background-color: #0b5ed7;
        }

        .btn-cancel {
            background-color: #6c757d;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
        }

        .btn-cancel:hover {
            background-color: #5c636a;
        }
		
    </style>
	
	
</head>

<body>

    <div class="container">
        <h2>タスク編集</h2>

        <form th:action="@{/tasks/update/{id}(id=*{id})}" method="post" th:object="${task}">

            <!--どのタスクを編集しているのかをサーバーに教えるための隠しID-->
            <input type="hidden" name="id" th:value="*{id}"/>

            <div class="form-group">
                <label for="title">タイトル</label>
                <input type="text" id="title" name="title" th:value="*{title}"/>
            </div>

            <div class="form-group">
                <label for="content">内容</label>
                <textarea id="content" name="content" th:text="*{content}"></textarea>
            </div>

            <div class="form-group">
                <label for="name">登録者</label>
                <input type="text" id="name" name="name" th:value="*{name}"/>
            </div>

            <div class="form-group">
                <label for="startDate">開始日</label>
                <input type="date" id="startDate" name="startDate" th:value="*{startDate}"/>
            </div>

            <div class="form-group">
                <label for="endDate">終了日</label>
                <input type="date" id="endDate" name="endDate" th:value="*{endDate}"/>
            </div>

            <div class="button-group">
                <button type="submit" class="btn-update">更新</button>
                <a th:href="@{/tasks}" class="btn-cancel">← キャンセル</a>
            </div>

        </form>
    </div>

</body>
</html>
