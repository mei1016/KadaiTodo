<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>タスク一覧</title>
	
	
    <style>
		
        body {
            font-family: sans-serif;
            margin: 40px;
            background-color: #fafafa;
        }

        .container {
            max-width: 1250px;
            margin: 0 auto;
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        .empty-box {
            text-align: center;
            background-color: #e0f7fa;
            padding: 15px;
            border-radius: 4px;
            color: #006064;
            margin-bottom: 20px;
        }

        .header-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 20px;
        }
		
		.btn-logout {
		    background-color: #6c757d;
		    color: white;
		    padding: 8px 16px;
		    border: none;
		    border-radius: 4px;
		    text-decoration: none;
		    font-size: 14px;
		}

        .btn-new {
            background-color: #198754;
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            text-decoration: none;
            font-size: 14px;
        }

        .btn-new:hover {
            background-color: #157347;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        th, td {
            padding: 12px 8px;
            text-align: left;
            border-bottom: 1px solid #ddd;
            font-size: 13px;
        }

        th {
            background-color: #343a40;
            color: white;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        .action-forms {
            display: flex;
            gap: 5px;
        }

        .btn-edit {
            background-color: #0d6efd;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .btn-delete {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        /* ページネーション（ページめくるボタン）のスタイル */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
            gap: 5px;
        }

        .pagination a, .pagination span {
            padding: 6px 12px;
            border: 1px solid #dee2e6;
            color: #0d6efd;
            text-decoration: none;
            border-radius: 4px;
            font-size: 14px;
        }

        .pagination span.active {
            background-color: #0d6efd;
            color: white;
            border-color: #0d6efd;
        }

        .pagination a.disabled {
            color: #6c757d;
            pointer-events: none;
            background-color: #f8f9fa;
        }
		
    </style>
	
	
</head>
<body>

    <div class="container">
        <h2>タスク一覧</h2>

        <!--タスクがない時-->
        <div th:if="${tasks.empty}">
            <div class="empty-box">
                📬 現在タスクは登録されていません。「新規作成」から追加してください。
            </div>
        </div>

        <!--タスクがある時-->
        <div th:if="${!tasks.empty}">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>タイトル</th>
                        <th>内容</th>
                        <th>登録者</th>
                        <th>開始日</th>
                        <th>終了日</th>
                        <th>作成日時</th>
                        <th>更新日時</th>
                        <th>操作</th>
                    </tr>
                </thead>

                <tbody>
                    <tr th:each="task : ${tasks}">
                        <td th:text="${task.id}">1</td>
                        <td th:text="${task.title}">タイトル</td>
                        <td th:text="${task.content}">内容</td>
                        <td th:text="${task.name}">名前</td>
                        <td th:text="${task.startDate}">2026-06-01</td>
                        <td th:text="${task.endDate}">2026-06-02</td>
						<td th:text="${#temporals.format(task.createdAt, 'yyyy-MM-dd HH:mm:ss')}"></td>
						<td th:text="${#temporals.format(task.updatedAt, 'yyyy-MM-dd HH:mm:ss')}"></td>

						
                        <td>
                            <div class="action-forms">
								
								<form th:action="@{/tasks/edit/{id}(id=${task.id})}" method="get">
								    <input type="submit" value="編集" class="btn-edit">
								</form>

								<form th:action="@{/tasks/delete/{id}(id=${task.id})}" method="post">
								    <input type="submit" value="削除" class="btn-delete">
						        </form>

								
                            </div>
                        </td>
						
                    </tr>
                </tbody>
            </table>

            <!--ページネーションボタン-->
            <div class="pagination">

                <!--前へボタン-->
                <a th:href="@{/tasks(page=${taskPage.number})}"
                   th:class="${taskPage.first} ? 'disabled' : ''">
                    &laquo; 前
                </a>

                <!--ページ番号の繰り返し-->
                <span th:each="i : ${#numbers.sequence(1, taskPage.totalPages == 0 ? 1 : taskPage.totalPages)}">
                    <a th:href="@{/tasks(page=${i})}"
                       th:text="${i}"
                       th:class="${i == taskPage.number + 1} ? 'active' : ''">
                        1
                    </a>
                </span>

                <!--次へボタン-->
                <a th:href="@{/tasks(page=${taskPage.number + 2})}"
                   th:class="${taskPage.last} ? 'disabled' : ''">
                    次 &raquo;
                </a>

            </div>
        </div>

        <!--新規作成＆ログアウトボタン-->
        <div class="header-actions" style="gap: 10px;">
			<a th:href="@{/logout}" class="btn-logout">ログアウト</a>
			<a th:href="@{/tasks/new}" class="btn-new">＋ 新規作成</a>
        </div>

    </div>

</body>
</html>
